        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linejoin="round"
    >
        <rect x="2.25" y="3.25" width="19.5" height="3.5" rx="1.25" />
        <rect x="2.25" y="10.25" width="19.5" height="3.5" rx="1.25" />
        <rect x="2.25" y="17.25" width="19.5" height="3.5" rx="1.25" />
    </g>
</svg>
